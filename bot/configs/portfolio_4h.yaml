# Портфель-чемпион: 7 символов, LONG-ONLY, ADX>=30, бюджет риска 2%.
# Подобрано сеткой вариантов 2026-09-25 (in-sample; требует walk-forward).
symbols: [BTCUSDT, ETHUSDT, SOLUSDT, 1000PEPEUSDT, LINKUSDT, NEARUSDT, AAVEUSDT]
tf: 4h
db: history.db
equity: 10000
risk: 0.005         # 0.5% на сделку
fee: 0.0005
slip: 0.0002
funding: true
max_positions: 4
max_total_risk: 0.02  # суммарный риск открытых позиций ≤ 2% equity

strategy:
  name: trend
  params:
    ma_type: ema
    fast: 20
    slow: 50
    adx_min: 30       # портфель: торгуем только сильные тренды (плато 28–30)
    ema_filter: 0
    exit: signal
    atr_period: 14
    atr_mult: 2.5
    tp_r: 3.0
    long_short: false  # long-only: шорты в крипте проигрывают дрейфу вверх
