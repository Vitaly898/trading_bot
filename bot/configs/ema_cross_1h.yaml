# Базовый тестовый прогон: пересечение EMA, без фильтров.
# Используется как эталон «толповой» стратегии для сравнения слоёв.
symbol: BTCUSDT
tf: 1h
db: history.db
equity: 10000
risk: 0.01
fee: 0.0005
slip: 0.0002
funding: true

strategy:
  name: ema_cross
  params:
    fast: 20
    slow: 50
    atr_period: 14
    atr_mult: 2.0
