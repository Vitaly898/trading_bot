# Рабочий стенд: ETH + SOL, разработка стратегии.
# Параметры — чемпион с прошлых этапов (точка отсчёта, не финал).
symbols: [ETHUSDT, SOLUSDT]
tf: 4h
db: history.db
equity: 10000
risk: 0.01          # 1% на сделку
fee: 0.0005
slip: 0.0002
funding: true
max_positions: 2
max_total_risk: 0.02
mode: shared

strategy:
  name: trend
  params:
    ma_type: kama
    fast: 12
    slow: 50
    adx_min: 30
    ema_filter: 0
    exit: signal
    atr_period: 14
    atr_mult: 2.5
    tp_r: 3.0
    long_short: false
